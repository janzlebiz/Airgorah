[workspace]
resolver = "2"
members = ["common", "analysis", "android-bridge"]

[workspace.package]
version = "0.9.0-mobile.1"
edition = "2024"
license = "MIT"
authors = ["Martin Olivier <martin.olivier@live.fr>", "Airgorah Mobile Contributors"]
repository = "https://github.com/janzlebiz/Airgorah"

[workspace.dependencies]
airgorah-common = { path = "common" }
airgorah-analysis = { path = "analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
lazy_static = "1"
libwifi = "0.5"
radiotap = "1"
chrono = "0.4"
csv = "1.4"
jni = "0.21"
